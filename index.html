<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
                    <!-- Navigation Bar     -->
    <header class="nav">
        <h1>Flower Shop</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
                    <!-- Hero Section  -->
    <section id="home" class="home">
        <div>
            <h2>Fresh Flowers</h2>
            <p>Elegant, vibrant, and handpicked blooms delivered with care.</p>
        </div>
        <div>
            <img src="madia/img.jpg" alt="Luxury bouquet hero">
        </div>    
    </section>
                    <!-- Shop Section -->
    <section id="shop">
        <h2>Our Flowers</h2>
        <div>
            <img src="madia/ima1.jpg" alt="Red Rose">
            <h3>Sunrise Bliss</h3>
            <p>Price: $70</p>
            <a href="payment.html" target="_blank">
            <button>Buy</button>
            </a>
        </div>
        <div>
            <img src="madia/img2.jpg" alt="Pink Tulip">
            <h3>Mystic Garden</h3>
            <p>Price: $75</p>
            <a href="payment.html" target="_blank">
                <button>Buy</button>
            </a>
        </div>
        <div>
            <img src="madia/img3.jpg" alt="White Flower">
            <h3>Pure Elegance</h3>
            <p>Price: $90</p>
            <a href="payment.html" target="_blank">
                <button>Buy</button>
            </a>
        </div>
    </section>
                    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: flowershop@gmail.com</p>
        <p>Phone: +20 100 123 4567</p>
    </section>
                    <!-- Footer -->
    <footer>
        <p>© 2026 Flower Shop</p>
    </footer>
</body>
</html>
